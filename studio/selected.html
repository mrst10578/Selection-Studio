<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><meta name="theme-color" content="#0a0d12" /><title>Selection Studio — Selected</title><link rel="stylesheet" href="./styles.css" /></head>
<body>
<header class="topbar"><div><span class="eyebrow">TESTBANK / BATCH</span><h1>لیست سوالات</h1><p>مرور، اصلاح و ارسال برای Review.</p></div><nav><a href="./">گزینش</a><a class="active" href="./selected.html">لیست <b id="navCount">0</b></a><a href="./guide.html">راهنما</a></nav></header>
<main class="shell selected-page">
  <section class="panel batch-summary"><div class="section-head"><div><span class="eyebrow">CURRENT BATCH</span><h2 id="examLabel">-</h2><p><b id="questionCount">0</b> سوال · <b id="readyCount">0</b> آماده</p></div><div class="summary-actions"><a class="button-link" href="./">+ افزودن سوال</a><button id="submitBatch" class="primary" disabled>ارسال برای بررسی</button><button id="settingsBtn" type="button">⚙ تنظیمات</button></div></div></section>
  <section class="panel batch-gate" aria-live="polite"><div class="section-head compact"><div><span class="eyebrow">UX CHECK</span><h2>آمادگی ارسال</h2></div><span id="batchBadge" class="gate-badge blocked">قفل</span></div><p id="batchGateText">در حال بررسی…</p><div id="batchIssues" class="issue-chips"></div></section>
  <section class="panel list-panel"><div class="section-head compact"><div><h2>سوالات انتخاب‌شده</h2><p>هر سوال ناقص دلیل خودش را نشان می‌دهد.</p></div><div><button id="exportQuestions" type="button">questions.jsonl</button><button id="exportExam" type="button">exam.jsonl</button></div></div><div id="questionList" class="question-list"></div></section>
</main>
<dialog id="settingsDialog" class="settings-dialog"><form method="dialog" class="dialog-card"><div class="section-head"><div><span class="eyebrow">CONNECTION</span><h2>تنظیمات ارسال</h2></div><button value="cancel">بستن</button></div><label>Worker URL<input id="workerUrl" placeholder="https://...workers.dev" /></label><label>کلید ارسال<input id="submitKey" type="password" /></label><label>نام اپراتور<input id="submittedBy" /></label><button id="saveSettings" class="primary" value="default">ذخیره تنظیمات</button></form></dialog>
<dialog id="editDialog" class="settings-dialog"><div class="dialog-card wide"><div class="section-head"><div><span class="eyebrow">QUESTION EDITOR</span><h2 id="editTitle">ویرایش سوال</h2></div><button id="closeEdit" type="button">بستن</button></div><form id="editForm">
  <div class="two"><label>شماره سوال<input id="editNumber" type="number" min="1" /></label><label>درس<select id="editSubject"><option value="BIO">زیست‌شناسی</option><option value="MATH">ریاضی</option><option value="PHY">فیزیک</option><option value="CHEM">شیمی</option></select></label></div>
  <div class="two" id="editGradeChapterRow"><label id="editGradeField">پایه<select id="editGrade"><option value="10">دهم</option><option value="11">یازدهم</option><option value="12">دوازدهم</option></select></label><label><span id="editChapterLabel">فصل</span><select id="editChapter"><option value="">انتخاب</option></select></label></div>
  <div class="two"><label><span id="editUnitLabel">گفتار</span><select id="editUnit"><option value="">انتخاب</option></select></label><label>Level<select id="editDifficulty"><option value="">انتخاب</option><option value="level_1">Level 1</option><option value="level_2">Level 2</option><option value="level_3">Level 3</option><option value="level_4">Level 4</option><option value="level_5">Level 5</option></select></label></div>
  <label>کلید<select id="editOption"><option value="">انتخاب</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></label>
  <section id="editBioPanel" class="bio-panel hidden" hidden></section>
  <button class="primary large" type="submit">ذخیره تغییرات</button>
</form></div></dialog>
<template id="questionCard"><article class="question-card"><div class="previews"><div><span>سوال</span><img class="q-preview" alt="پیش‌نمایش سوال" /></div><div><span>پاسخ</span><img class="a-preview" alt="پیش‌نمایش پاسخ" /></div></div><div class="question-main"><div class="question-title"><strong></strong><span class="quality-badge"></span></div><div class="question-meta"></div><div class="question-missing"></div><div class="question-actions"><button class="edit-btn" type="button">ویرایش</button><button class="delete-btn" type="button">حذف</button></div></div></article></template>
<script type="module" src="./selected.js"></script>
</body></html>
