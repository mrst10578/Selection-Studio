name: Validate and deploy Selection Studio
on:
  pull_request:
    paths: ["studio/**", "review-console/**", "cloudflare/**", "tests/**", ".github/workflows/deploy-cloudflare-pages.yml"]
  push:
    branches: [main]
    paths: ["studio/**", "review-console/**", "cloudflare/**", "tests/**", ".github/workflows/deploy-cloudflare-pages.yml"]
  workflow_dispatch:
    inputs:
      release_production:
        description: 'Explicitly approve production release after acceptance testing'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: selection-studio-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/studio _site/admin
          cp -R studio/. _site/
          cp -R studio/. _site/studio/
          cp -R review-console/. _site/admin/
          cp cloudflare/_worker.js _site/_worker.js
          cp cloudflare/ocr-batch-api.js cloudflare/ocr-batch-core.js cloudflare/question-api-v1.js cloudflare/private-asset-api.js cloudflare/private-assets.js cloudflare/question-review-api.js cloudflare/approved-bank-api.js _site/
          cat > _site/_headers <<'HEADERS'
          /*
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(), geolocation=()
          HEADERS
          test -f _site/index.html
          test -f _site/studio/index.html
          test -f _site/admin/ocr-studio.html
          test -f _site/_worker.js
          test -f _site/ocr-batch-api.js
          test -f _site/ocr-batch-core.js
          test -f _site/question-api-v1.js
          test -f _site/private-asset-api.js
          test -f _site/private-assets.js
          test -f _site/question-review-api.js
          test -f _site/approved-bank-api.js
          mkdir -p _site/engine
          cp engine/test-composer.js engine/answer-matcher.js _site/engine/
          test -f _site/engine/test-composer.js
          test -f _site/engine/answer-matcher.js
          ! grep -R -n 'mrst10578.github.io' _site/*.html _site/studio/*.html || exit 1
      - name: Syntax and security regression checks
        run: |
          node --check cloudflare/_worker.js
          node --check studio/atelier-pro.js
          node --test tests/*.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: selection-studio-pages
          path: _site/
  deploy-preview:
    needs: validate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Preview is protected by the account's wildcard Cloudflare Access app.
    # No secrets => no deployment, and never fall back to production.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check preview deployment credentials
        id: credentials
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare Preview deployment skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.credentials.outputs.enabled == 'true'
        with:
          name: selection-studio-pages
          path: _site
      - name: Deploy protected PR branch to Cloudflare Pages Preview
        if: steps.credentials.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=selection-studio --branch="${{ github.head_ref }}"
  release-qa:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_production == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Python and worker tests
        run: |
          python -m compileall engine
          node --test worker/test/*.test.mjs
      - name: Install UI validation dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Validate HTML, CSS, Playwright and Lighthouse
        run: |
          npm run qa:html
          npm run qa:css
          npm run qa:ui
          npm run qa:lighthouse
      - name: Verify canonical question catalog
        run: |
          python engine/validate_bank.py
          python engine/build_catalog.py --output /tmp/catalog.json
          cmp /tmp/catalog.json runtime/catalog.json

  deploy:
    needs: [validate, release-qa]
    # Never deploy on a push or PR. An explicitly approved workflow_dispatch
    # on main must pass all release QA before any production deploy.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_production == true
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: selection-studio-pages
          path: _site
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=selection-studio --branch=main
