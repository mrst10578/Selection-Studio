name: Deploy Selection Studio to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - "review-console/**"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-selection-studio-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-production
      url: https://selection-studio-e1c.pages.dev/studio/
    steps:
      - uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p dist/studio dist/admin
          cp -R studio/. dist/studio/
          cp -R review-console/. dist/admin/
          cp -R studio/. dist/
          test -f dist/studio/index.html
          test -f dist/admin/ocr-studio.html
          printf '%s\n' '/ /studio/ 302' '/studio /studio/ 302' '/admin /admin/ 302' > dist/_redirects

      - name: Deploy static assets to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=selection-studio --branch=main

      - name: Smoke test published pages
        run: |
          for path in /studio/ /admin/ocr-studio.html /admin/ocr-studio.js; do
            curl --fail --retry 5 --retry-delay 4 --retry-connrefused -I "https://selection-studio-e1c.pages.dev$path"
          done
