name: Deploy Selection Studio Preview

on:
  push:
    branches: ["main"]
    paths:
      - "studio/**"
      - "review-console/**"
      - ".github/workflows/deploy-studio-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "selection-studio-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static preview
        run: |
          mkdir -p _site _site/studio _site/admin
          cp -R studio/. _site/
          cp -R studio/. _site/studio/
          cp -R review-console/. _site/admin/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
