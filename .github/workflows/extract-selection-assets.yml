name: Extract Selection Studio Assets

on:
  push:
    branches:
      - feature/selection-studio-assets-v1
    paths:
      - ".github/workflows/extract-selection-assets.yml"

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/selection-studio-assets-v1
          fetch-depth: 0

      - name: Extract web assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf studio/assets/selection
          mkdir -p studio/assets/selection
          unzip -j assets/selection-studio/selection-studio-assets-24.zip 'webp/*.webp' -d studio/assets/selection
          unzip -p assets/selection-studio/selection-studio-assets-24.zip manifest.json > studio/assets/selection/manifest.json
          test "$(find studio/assets/selection -maxdepth 1 -name '*.webp' | wc -l)" -eq 24

      - name: Commit extracted assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/assets/selection
          if git diff --cached --quiet; then
            echo "Assets already extracted."
            exit 0
          fi
          git commit -m "assets: extract 24 Selection Studio web assets"
          git push origin HEAD:feature/selection-studio-assets-v1
